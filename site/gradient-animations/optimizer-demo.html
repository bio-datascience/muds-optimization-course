<!doctype html><html><head><meta charset="utf-8"><title>Optimization</title><style>
body{margin:8px;color:#333;font:17px/1.3 Avenir,Arial,sans-serif}button,select{font:inherit;background:white;border:1px solid #bbb;padding:4px 8px;cursor:pointer}header{display:flex;align-items:center;gap:10px;max-width:1000px;margin:0 auto 7px;font-size:15px}header label{display:flex;align-items:center;gap:5px}main{display:grid;grid-template-columns:minmax(0,720px) 230px;gap:18px;max-width:1000px;margin:auto}canvas{width:100%;height:440px;object-fit:contain}h1{font-size:19px;font-weight:500;margin:3px 0 10px}p{margin:8px 0}.formula{font-size:14px;min-height:38px;color:#444}.note{font-size:13px;color:#666}dl{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}dt{font-size:13px;color:#666}dd{font-size:18px;margin:0}.status{font-size:13px;min-height:34px}#explain{font-size:15px}#legend{font-size:12px}.controls{display:flex;gap:8px;align-items:center;max-width:1000px;margin:6px auto}input{flex:1;accent-color:#397fa3}footer{max-width:1000px;margin:auto;min-height:38px}a{color:#246b93}#extra{font-size:13px}#sgd-rate-label[hidden],#sgd-schedule-label[hidden],#gd-rate-label[hidden],#start-label[hidden],#stochastic[hidden],#decay-label[hidden]{display:none}#stochastic{display:flex;gap:8px}#busy{font-size:13px;color:#666}button:disabled{opacity:.5}
</style></head><body><header><select id="method" aria-label="Optimizer"><option value="cma">CMA-ES</option><option value="gd">Gradient descent</option><option value="newton">Newton</option><option value="bfgs">BFGS</option><option value="sgd">SGD</option><option value="adam">Adam</option><option value="adamw">AdamW</option></select><select id="landscape" aria-label="Landscape"><option value="quadratic">Rotated quadratic</option><option value="rastrigin">Rastrigin</option></select><label>Loss scale <select id="loss-scale" aria-label="Loss curve scale"><option value="linear">Linear</option><option value="log" selected>Log</option></select></label><label id="gd-rate-label" hidden>Step size η <select id="gd-rate"><option value="0.25">0.25/L · small</option><option value="1" selected>1/L · standard</option><option value="1.9">1.9/L · large</option></select></label><label id="start-label" hidden>Start <select id="start" aria-label="Starting point"><option value="original">(2.5, 2.5)</option><option value="perturbed">(2.6, 2.3)</option></select></label><span id="busy"></span></header><main><div><canvas id="view" width="720" height="500" aria-label="Objective contours and actual optimizer trajectory"></canvas></div><aside><h1 id="heading"></h1><p id="explain"></p><p class="formula" id="formula"></p><dl><div><dt>Iteration t</dt><dd id="iteration"></dd></div><div><dt>Current loss</dt><dd id="loss"></dd></div><div><dt>Best iterate loss</dt><dd id="best"></dd></div><div><dt id="norm-label">\(\|\nabla f(\mathbf x_t)\|\)</dt><dd id="norm"></dd></div></dl><p id="state" class="status"></p><p id="extra" class="note"></p><p class="note" id="legend">Red cross: current xₜ<br>Blue: actual last step<br>Gray: previous iterates<br>Dashed gray: −∇f direction</p></aside></main><div class="controls"><button id="play">Play</button><button id="step">Step</button><button id="reset">Initial state</button><input id="time" type="range" min="0" value="0" aria-label="Iteration"></div><header><span id="stochastic" hidden><label><span id="noise-label">Gradient noise</span> <select id="noise" aria-label="Gradient noise"><option value="0">Off</option><option value="10" selected>Moderate (σ = 10)</option><option value="30">Strong (σ = 30)</option><option value="100">Extreme (σ = 100)</option></select></label><label>Batch b <select id="batch" aria-label="Batch size"><option value="1">1</option><option value="8">8</option></select></label><label>Seed <select id="seed" aria-label="Random seed"><option value="3">3</option><option value="7">7</option></select></label></span><label id="sgd-rate-label" hidden>SGD step <select id="sgd-rate"><option value="1">1/L</option><option value="2">2/L</option><option value="4">4/L</option></select></label><label id="sgd-schedule-label" hidden>Schedule <select id="sgd-schedule"><option value="constant">Constant</option><option value="cooling">Explore → settle</option></select></label><label id="decay-label" hidden>Decay λ <select id="decay" aria-label="Weight decay"><option value="0.1">0.1</option><option value="0">0</option><option value="1">1</option></select></label></header><footer class="note" id="foot"></footer><script src="../assets/course-progress.js?v=log2"></script><script>window.MathJax={startup:{typeset:false},svg:{fontCache:"none"},options:{enableMenu:false}};</script><script defer src="../course-v1/vendor/mathjax-tex-svg.js"></script><script src="noisy-runs.js?v=extreme2"></script><script src="noisy-cma.js?v=1"></script><script defer src="optimizer-demo.js?v=cma-noise1"></script></body></html>
