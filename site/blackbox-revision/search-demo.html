<!doctype html><meta charset="utf-8"><title>Random sampling and covariance adaptation</title><style>body{margin:8px;font:17px/1.35 Avenir,Arial,sans-serif;color:#333}main{display:grid;grid-template-columns:minmax(0,720px) 230px;gap:18px;max-width:1000px;margin:auto}canvas{width:100%;height:auto}h1{font-size:21px;font-weight:500;margin:3px 0 12px}button,select{font:inherit;padding:4px 10px;background:white;border:1px solid #bbb;cursor:pointer}.controls{display:flex;gap:8px;align-items:center;margin:8px auto;max-width:1000px}input{flex:1;accent-color:#397fa3}.note{font-size:13px;color:#666}dt{color:#666;font-size:14px}dd{margin:0 0 8px;font-size:21px}.status{min-height:45px}a{color:#246b93}.embedded h1{font-size:19px}</style><main><div><canvas id="view" width="720" height="500" aria-label="Objective contours, sampled points and adapting Gaussian search distribution"></canvas></div><aside><h1 id="heading"></h1><p id="explain"></p><dl><dt>Iteration t</dt><dd id="iteration"></dd><dt>Evaluations k</dt><dd id="evaluations"></dd><dt>Best observed loss</dt><dd id="best"></dd></dl><p id="state" class="status"></p><p id="acceptance" class="note" hidden></p><p class="note">Black dots: proposals<br>Green: selected / accepted<br>Red cross: current mean<br>Blue: 2-standard-deviation ellipse</p><select id="run" aria-label="Stochastic run"><option value="rastrigin">Seed 0</option><option value="rastrigin_local">Seed 7</option></select><p id="caution" class="note"></p></aside></main><div class="controls"><button id="play">Play</button><button id="step">Step</button><button id="reset">Initial state</button><input id="time" type="range" min="0" value="0" aria-label="Iteration"></div><p class="note" style="max-width:1000px;margin:5px auto" id="foot"></p><script src="../assets/course-progress.js"></script><script src="gaa-history.js"></script><script>
(async()=>{const data=await(await fetch('search-animation-data.json')).json();const mode=new URLSearchParams(location.search).get('mode')||'rastrigin';document.body.classList.add('embedded');const isR=mode==='rastrigin',isG=mode==='gaa';const title=isR?'CMA-ES on Rastrigin':isG?'Gaussian adaptation (GaA)':mode==='local'?'Local improvement: (1+1)-ES':'Learning search directions';document.title=title;document.getElementById('heading').textContent=title;document.getElementById('explain').textContent=isR?'Sample a population, rank its losses, then adapt mean, shape and step size.':isG?'Draw one candidate. Accept below cₜ; adapt the mean, scale and shape.':mode==='local'?'Draw one candidate from a circular Gaussian. Move to it when its loss improves.':'Repeated successful displacements change the shape and orientation of the sampling cloud.';document.getElementById('run').hidden=!isR;document.getElementById('caution').textContent=isR?'Seed 0 reaches the global minimum; seed 7 a local minimum.':(isG?'Same initial mean, radius, shape and random seed as (1+1)-ES. Orange: f(x) = cₜ.':mode==='local'?'This is strict-improvement (1+1)-ES. GaA uses a moving acceptance threshold.':'Direction learning here uses CMA-ES. GaA learns from threshold-accepted samples.');document.getElementById('foot').innerHTML=isG?'Same rotated quadratic: f(x) = z₁² + 35z₂², z = Rᵀx. GaA: p = 2, qₜ = 1; accepted samples lower cₜ and adapt the Gaussian. <a href="https://publications.mpi-cbg.de/M%C3%BCller_2010_5171.pdf" target="_blank" rel="noopener">Müller &amp; Sbalzarini (2010), Eqs. 4–8</a>':isR?'Unconstrained 2D Rastrigin, f(x₁,x₂) = 20 + Σⱼ[xⱼ² − 10 cos(2πxⱼ)]; global minimum f(0,0) = 0. q = 24, m_sel = 12. Genuine CMA-ES samples and updates; no interpolated trajectory. <a href="https://arxiv.org/abs/1604.00772" target="_blank" rel="noopener">Algorithm reference: Hansen</a>':'Same rotated quadratic landscape in both local-search figures: f(x) = z₁² + 35z₂², z = Rᵀx, rotation 0.65 radians. Circular sampling is isotropic; the learned ellipse aligns with the valley.';
let key=isR?'rastrigin':mode,frames=data[key],index=0,timer=null;const slider=document.getElementById('time'),canvas=document.getElementById('view'),ctx=canvas.getContext('2d');const X=x=>130+(x+6)/12*400,Y=y=>450-(y+6)/12*400;const f=(x,y)=>isR?20+x*x+y*y-10*Math.cos(2*Math.PI*x)-10*Math.cos(2*Math.PI*y):Math.pow(Math.cos(.65)*x+Math.sin(.65)*y,2)+35*Math.pow(-Math.sin(.65)*x+Math.cos(.65)*y,2);const background=document.createElement('canvas');background.width=720;background.height=500;const bc=background.getContext('2d');bc.fillStyle='white';bc.fillRect(0,0,720,500);
// Mathematical contour plot, using the original course's planar landscape/ellipse template.
const N=100,levels=isR?[4,10,18,28,40,55,70]:[1,4,12,35,90,220,500,1000];for(const level of levels){bc.strokeStyle=isR?'#d8dedb':'#d5ddd9';bc.lineWidth=.8;bc.beginPath();for(let j=0;j<N;j++)for(let i=0;i<N;i++){const x=-6+12*i/N,y=-6+12*j/N,h=12/N,corners=[[x,y],[x+h,y],[x+h,y+h],[x,y+h]],vals=corners.map(v=>f(...v)),pts=[];for(let e=0;e<4;e++){let a=e,b=(e+1)%4;if((vals[a]<level)!==(vals[b]<level)){let u=(level-vals[a])/(vals[b]-vals[a]);pts.push([corners[a][0]+u*(corners[b][0]-corners[a][0]),corners[a][1]+u*(corners[b][1]-corners[a][1])])}}for(let e=0;e+1<pts.length;e+=2){bc.moveTo(X(pts[e][0]),Y(pts[e][1]));bc.lineTo(X(pts[e+1][0]),Y(pts[e+1][1]))}}bc.stroke()}bc.strokeStyle='#666';bc.strokeRect(130,50,400,400);bc.font='15px Avenir,Arial';bc.fillStyle='#555';for(const v of [-6,-3,0,3,6]){bc.fillText(v,X(v)-5,473);bc.fillText(v,100,Y(v)+5)}bc.fillText('x₁',545,472);bc.fillText('x₂',105,31);bc.fillText('minimum',X(0)+9,Y(0)-10);bc.fillStyle='#555';bc.fillRect(X(0)-3,Y(0)-3,6,6);
function pause(){if(timer)clearInterval(timer);timer=null;document.getElementById('play').textContent='Play'}function draw(){const a=frames[index];ctx.clearRect(0,0,720,500);ctx.drawImage(background,0,0);ctx.save();ctx.beginPath();ctx.rect(130,50,400,400);ctx.clip();if(isG){ctx.strokeStyle='#b78740';ctx.setLineDash([5,5]);ctx.beginPath();for(let j=0;j<=160;j++){let u=2*Math.PI*j/160,v=Math.sqrt(a.threshold)*Math.cos(u),w=Math.sqrt(a.threshold/35)*Math.sin(u),x=Math.cos(.65)*v-Math.sin(.65)*w,y=Math.sin(.65)*v+Math.cos(.65)*w;j?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke();ctx.setLineDash([])}ctx.strokeStyle='#b3b3b3';ctx.lineWidth=1;ctx.beginPath();for(let k=0;k<=index;k++){const m=frames[k].m;k?ctx.lineTo(X(m[0]),Y(m[1])):ctx.moveTo(X(m[0]),Y(m[1]))}ctx.stroke();let [aa,bb]=a.C[0],[,dd]=a.C[1],theta=.5*Math.atan2(2*bb,aa-dd),disc=Math.hypot(aa-dd,2*bb),d1=Math.sqrt(Math.max((aa+dd+disc)/2,0)),d2=Math.sqrt(Math.max((aa+dd-disc)/2,0));ctx.strokeStyle='#397fa3';ctx.lineWidth=2;ctx.beginPath();for(let j=0;j<=120;j++){let u=2*Math.PI*j/120,v=2*a.sigma*d1*Math.cos(u),w=2*a.sigma*d2*Math.sin(u),x=a.m[0]+Math.cos(theta)*v-Math.sin(theta)*w,y=a.m[1]+Math.sin(theta)*v+Math.cos(theta)*w;j?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke();for(let j=0;j<a.points.length;j++){const p=a.points[j],selected=a.selected.includes(j);ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),selected?4.5:3.4,0,2*Math.PI);ctx.fillStyle=selected?'#238b45':'#444';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=1;ctx.stroke()}ctx.strokeStyle='#c33';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(X(a.m[0])-6,Y(a.m[1]));ctx.lineTo(X(a.m[0])+6,Y(a.m[1]));ctx.moveTo(X(a.m[0]),Y(a.m[1])-6);ctx.lineTo(X(a.m[0]),Y(a.m[1])+6);ctx.stroke();ctx.restore();ctx.font='18px Avenir,Arial';ctx.fillStyle='#444';ctx.fillText(index===0?'Initial state':`Iteration ${a.t}`,130,28);document.getElementById('iteration').textContent=a.t;document.getElementById('evaluations').textContent=a.k;document.getElementById('best').textContent=a.best<1e-8?a.best.toExponential(2):a.best.toFixed(4);document.getElementById('state').textContent=isG?('cₜ = '+a.threshold.toFixed(3)+' · '+(index===0?'Initial state':a.accepted?'Accept candidate':'Reject candidate')):mode==='local'?(index===0?'Initial parent and circular sampling region.':a.accepted?'Improvement: accept this candidate.':'No improvement: retain the parent.'):(index===0?'Initial circular distribution and sampled population.':'The population is resampled at every iteration.');if(isG){const el=document.getElementById('acceptance');el.hidden=false;el.innerHTML='Current P[f(X) &lt; cₜ]: <b>'+(100*a.acceptance_probability).toFixed(1)+'%</b><br>Target 1/e: '+(100*a.target_acceptance_probability).toFixed(1)+'%';}if(isG)drawGaAHistory(canvas,frames,index);else CourseProgress.draw(canvas,frames.map(p=>({x:p.t,y:p.best})),index,{label:'Best observed f'});slider.value=index;window.animationState={mode,key,index,frame:a,total:frames.length};}
slider.max=frames.length-1;document.getElementById('play').onclick=()=>{if(timer)return pause();if(index===frames.length-1)index=0;document.getElementById('play').textContent='Pause';timer=setInterval(()=>{index++;if(index>=frames.length){index=frames.length-1;pause()}draw()},220)};document.getElementById('step').onclick=()=>{pause();index=Math.min(index+1,frames.length-1);draw()};document.getElementById('reset').onclick=()=>{pause();index=0;draw()};slider.oninput=()=>{pause();index=+slider.value;draw()};document.getElementById('run').onchange=e=>{pause();key=e.target.value;frames=data[key];index=0;slider.max=frames.length-1;draw()};if(self!==top)document.getElementById('foot')?.querySelectorAll('a').forEach(a=>a.remove());document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('message',e=>{if(e.data==='course-pause')pause()});draw();})().catch(e=>{document.body.textContent='Animation could not load: '+e.message;throw e});
</script>
