<!doctype html><html lang="en"><meta charset="utf-8"><title>Muon and Polar Express</title><style>@font-face{font-family:CourseSans;src:local('Avenir-Book'),local('Avenir Book'),local('Avenir')}*{box-sizing:border-box}body{margin:0;padding:4px 12px;font:18px/1.35 CourseSans,Avenir,Arial;color:#252525;background:white}.row{display:grid;grid-template-columns:58% 1fr;gap:20px;align-items:center}svg{width:100%;height:230px}button,select{font:inherit;padding:5px 9px;background:#f6f7f5;border:1px solid #aaa}input{width:220px;vertical-align:middle}label{margin-right:12px}p{margin:8px 0}.small{font-size:16px;color:#666}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.readout{font-variant-numeric:tabular-nums}</style><div class="row"><svg id="plot" viewBox="0 0 520 230" role="img"></svg><div id="explanation"></div></div><div class="controls"><button id="play">▶ Play</button><button id="reset">Reset</button><label id="slider-label"></label><input id="step" type="range" min="0" value="0"><output id="value"></output><select id="method" aria-label="Polar approximation method"><option value="pe">Polar Express</option><option value="ns">Classical Newton–Schulz</option><option value="jordan">Muon tuned quintic</option></select></div><p class="small" id="note"></p><script type="module">
const geom=new URLSearchParams(location.search).get('mode')==='geometry',$=s=>document.querySelector(s);let timer;const data=await fetch('polar-data.json').then(r=>r.json());$('#step').max=geom?100:8;$('#method').hidden=geom;$('#slider-label').textContent=geom?'Remove the stretch':'Inner iteration j';
function render(){const j=+$('#step').value;if(geom){const t=j/100,a=.98+(1-.98)*t,b=.18+(1-.18)*t,angle=.45;let coords=[];for(let i=0;i<=100;i++){let q=i*Math.PI/50,x=a*Math.cos(q),y=b*Math.sin(q);coords.push([250+96*(Math.cos(angle)*x-Math.sin(angle)*y),115-96*(Math.sin(angle)*x+Math.cos(angle)*y)])}$('#plot').setAttribute('aria-label','Ellipse becoming a circle as its singular values approach one');$('#plot').innerHTML=`<path d="M120 115H380M250 8V222" stroke="#ddd"/><circle cx="250" cy="115" r="96" fill="none" stroke="#aaa" stroke-dasharray="5 5"/><path d="M${coords.map(p=>p.join(',')).join('L')}Z" fill="#27878e22" stroke="#27878e" stroke-width="3"/><g fill="#27878e">${coords.filter((_,i)=>i%5===0).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3"/>`).join('')}</g>`;$('#explanation').innerHTML=`<p>Exact polar target: a unit circle.</p><p>The singular-vector directions stay fixed; nonzero singular values become 1.</p><p class="readout">Singular values: ${a.toFixed(2)}, ${b.toFixed(2)}</p><p class="small">A full-rank 2 × 2 illustration of the update matrix, not a weight trajectory.</p>`;$('#value').textContent=j+'%';$('#note').textContent='Slider interpolates singular values to illustrate the exact polar factor; it is not an implementation of Muon’s finite polynomial iteration.';}
else{const method=$('#method').value,s=data[method][j],Y=z=>205-z/1.5*180;$('#plot').setAttribute('aria-label','Four singular values transformed by polynomial matrix iterations');$('#plot').innerHTML=`<path d="M45 12V205H490" fill="none" stroke="#aaa"/><path d="M45 ${Y(1)}H490" stroke="#999" stroke-dasharray="5 5"/><g font-family="CourseSans,Avenir,Arial" font-size="17" fill="#555"><text x="5" y="${Y(1)+5}">1</text><text x="8" y="210">0</text></g>`+s.map((v,i)=>`<rect x="${95+i*100}" y="${Y(v)}" width="45" height="${205-Y(v)}" fill="${['#27878e','#45969a','#d28a44','#b2bb4b'][i]}"/><text x="${117+i*100}" y="225" text-anchor="middle" font-size="17">σ${'₁₂₃₄'[i]}</text><text x="${117+i*100}" y="${Math.max(16,Y(v)-6)}" text-anchor="middle" font-size="16">${v.toFixed(3)}</text>`).join('');const err=Math.max(...s.map(v=>Math.abs(v-1)));$('#explanation').innerHTML=`<p>Same normalized starting spectrum for all methods.</p><p class="readout">Maximum error from 1:<br>${err.toExponential(2)}</p><p class="small">${method==='pe'?'Iteration-dependent quintics from the pinned authors’ implementation.':method==='ns'?'Classical cubic: 1.5s − 0.5s³.':'Fixed quintic: 3.4445s − 4.7750s³ + 2.0315s⁵; not exact polar convergence.'}</p>`;$('#value').textContent=j;$('#note').textContent='Float64 teaching simulation, not LLM training data or a bfloat16 benchmark. Zero singular values stay zero.';}}
$('#step').oninput=()=>{clearInterval(timer);render()};$('#method').onchange=()=>{clearInterval(timer);render()};$('#reset').onclick=()=>{clearInterval(timer);$('#step').value=0;render()};$('#play').onclick=()=>{clearInterval(timer);if(+$('#step').value>=+$('#step').max)$('#step').value=0;timer=setInterval(()=>{if(+$('#step').value>=+$('#step').max){clearInterval(timer);return}$('#step').value=+$('#step').value+(geom?2:1);render()},geom?45:650)};render();window.polarReady=true;
</script></html>
